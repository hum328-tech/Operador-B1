<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B1 AI Officer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .practice {
      width: min(92%, 430px);
      text-align: center;
    }

    .officer {
      font-size: 80px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 35px;
    }

    #status {
      min-height: 70px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #startBtn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: #111;
      color: white;
    }

    #startBtn:active {
      transform: scale(.98);
    }
  </style>
</head>

<body>

  <main class="practice">

    <div class="officer">👮</div>

    <h1>B1 AI Officer</h1>

    <p class="subtitle">
      Practice your English with a D.O.T. officer
    </p>

    <div id="status">
      Ready to start
    </div>

    <button id="startBtn">
      🎙️ START PRACTICE
    </button>

  </main>

<script>
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");

  const WORKER_URL =
    "https://b1-ai-officer.hum328.workers.dev";

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition = null;
  let conversation = [];
  let busy = false;
  let listening = false;
  let sessionActive = false;

  // -------------------------
  // RECONOCIMIENTO DE VOZ
  // -------------------------

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      status.textContent = "🎙️ Listening...";
    };

    recognition.onresult = async (event) => {
      listening = false;

      const answer =
        event.results[event.results.length - 1][0].transcript;

      status.textContent = 'You: "' + answer + '"';

      conversation.push({
        role: "user",
        text: answer
      });

      await askGemini();
    };

    recognition.onerror = (event) => {
      listening = false;

      console.log("Speech error:", event.error);

      if (event.error === "not-allowed") {
        status.textContent =
          "Microphone permission is required.";
        return;
      }

      if (event.error === "no-speech") {
        status.textContent =
          "I didn't hear you. Tap the button to listen again.";

        startBtn.textContent = "🎙️ LISTEN AGAIN";
        busy = false;
        return;
      }

      if (event.error === "aborted") {
        return;
      }

      status.textContent =
        "Microphone error. Tap the button to continue.";

      startBtn.textContent = "🎙️ CONTINUE";
      busy = false;
    };

    recognition.onend = () => {
      listening = false;
    };
  }

  // -------------------------
  // DETENER MICRÓFONO
  // -------------------------

  function stopListening() {
    if (!recognition) return;

    try {
      recognition.abort();
    } catch (error) {
      console.log(error);
    }

    listening = false;
  }

  // -------------------------
  // ESCUCHAR
  // -------------------------

  function listen() {
    if (!sessionActive) return;

    if (!recognition) {
      status.textContent =
        "Speech recognition is not supported on this browser.";
      return;
    }

    if (listening) return;

    busy = false;

    try {
      recognition.start();
    } catch (error) {
      console.log("Recognition start error:", error);

      setTimeout(() => {
        try {
          recognition.start();
        } catch (e) {
          console.log(e);
        }
      }, 500);
    }
  }

  // -------------------------
  // HABLAR
  // -------------------------

  function speak(text) {
    stopListening();

    window.speechSynthesis.cancel();

    status.textContent = "Officer: " + text;

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 0.9;
    speech.volume = 1;

    speech.onstart = () => {
      status.textContent = "Officer: " + text;
    };

    speech.onend = () => {
      if (!sessionActive) return;

      setTimeout(() => {
        listen();
      }, 600);
    };

    speech.onerror = (event) => {
      console.log("Speech synthesis error:", event);

      status.textContent =
        "Officer: " + text;

      startBtn.textContent = "🎙️ ANSWER";
      busy = false;
    };

    setTimeout(() => {
      window.speechSynthesis.speak(speech);
    }, 100);
  }

  // -------------------------
  // GEMINI
  // -------------------------

  async function askGemini() {
    if (busy) return;

    busy = true;

    stopListening();

    status.textContent = "Officer is thinking...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          messages: conversation
        })
      });

      const data = await response.json();

      if (!response.ok) {
        console.error("Worker error:", data);

        status.textContent =
          "AI connection error.";

        startBtn.textContent = "🔄 START AGAIN";
        busy = false;

        return;
      }

      if (!data.reply) {
        console.error("No reply:", data);

        status.textContent =
          "The officer did not answer.";

        startBtn.textContent = "🔄 START AGAIN";
        busy = false;

        return;
      }

      const reply = data.reply.trim();

      conversation.push({
        role: "assistant",
        text: reply
      });

      busy = false;

      speak(reply);

    } catch (error) {
      console.error("Connection error:", error);

      status.textContent =
        "Could not connect to the AI.";

      startBtn.textContent = "🔄 START AGAIN";

      busy = false;
    }
  }

  // -------------------------
  // NUEVA SESIÓN
  // -------------------------

  async function startNewSession() {
    sessionActive = false;

    stopListening();
    window.speechSynthesis.cancel();

    busy = false;

    conversation = [];

    await new Promise(resolve =>
      setTimeout(resolve, 300)
    );

    sessionActive = true;

    startBtn.textContent = "🔄 RESTART PRACTICE";

    conversation.push({
      role: "user",
      text: "Start a new inspection from the beginning."
    });

    await askGemini();
  }

  // -------------------------
  // BOTÓN
  // -------------------------

  startBtn.addEventListener("click", async () => {

    // Si está esperando una respuesta,
    // el botón sirve para reactivar el micrófono.
    if (
      sessionActive &&
      !busy &&
      !listening &&
      startBtn.textContent.includes("LISTEN")
    ) {
      startBtn.textContent = "🔄 RESTART PRACTICE";
      listen();
      return;
    }

    await startNewSession();
  });
</script>
</body>
</html>
