<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TTS Test</title>
</head>
<body>

<button id="test" style="font-size:28px;padding:20px;">
  TEST VOICE
</button>

<script>
let currentUtterance = null;

function getEnglishVoice() {
  const voices = speechSynthesis.getVoices();

  console.log("VOICES:", voices.map(v => ({
    name: v.name,
    lang: v.lang
  })));

  return (
    voices.find(v => v.lang === "en-US") ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en-us")) ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) ||
    null
  );
}

function testVoice() {
  const voice = getEnglishVoice();

  currentUtterance =
    new SpeechSynthesisUtterance(
      "Truck driver. Where are you going today?"
    );

  currentUtterance.lang = "en-US";
  currentUtterance.rate = 0.8;

  if (voice) {
    currentUtterance.voice = voice;
    console.log("USING VOICE:", voice.name, voice.lang);
  } else {
    console.log("NO ENGLISH VOICE FOUND");
  }

  currentUtterance.onstart = () =>
    console.log("TTS START");

  currentUtterance.onend = () =>
    console.log("TTS END");

  currentUtterance.onerror = e =>
    console.log("TTS ERROR", e.error);

  speechSynthesis.speak(currentUtterance);
}

speechSynthesis.onvoiceschanged = () => {
  console.log("VOICES LOADED");
  getEnglishVoice();
};

document.getElementById("test").onclick = testVoice;
</script>
</body>
</html>
